<!doctype html><html lang="es-AR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vista previa del borrador</title><link rel="stylesheet" href="{{url_for('static',path='css/style.css')}}"><style>.body{white-space:pre-wrap;line-height:1.6}.preview[hidden]{display:none}</style></head>
<body><main style="max-width:800px"><h1>Tu borrador guardado</h1><p><a href="/cuenta">← Mi cuenta</a></p><p><strong>No envía emails, no incluye CV.</strong></p>
{% for p in previews %}<article class="business-card preview" {% if not loop.first %}hidden{% endif %}><h2>{{p.business}}</h2><p><strong>Asunto:</strong> {{p.subject}}</p><div class="body">{{p.body}}</div></article>{% else %}<p>Los negocios de este borrador ya no están disponibles.</p>{% endfor %}
{% if previews %}<button type="button" id="prev">← Anterior</button> <span id="counter"></span> <button type="button" id="next">Siguiente →</button>{% endif %}
<form method="post" action="/cuenta/borradores/{{draft_id}}/eliminar" onsubmit="return confirm('¿Eliminar este borrador?')" style="margin-top:30px"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><button type="submit">Eliminar borrador</button></form></main>
<script>const items=[...document.querySelectorAll('.preview')];let cur=0;function display(){items.forEach((el,i)=>el.hidden=i!==cur);if(items.length){document.getElementById('counter').textContent=`${cur+1} / ${items.length}`;document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===items.length-1}}if(items.length){document.getElementById('prev').onclick=()=>{cur--;display()};document.getElementById('next').onclick=()=>{cur++;display()};display()}</script></body></html>
